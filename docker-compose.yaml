services:
  postgres:
    image: postgres:15-alpine
    container_name: arbitrio-postgres
    environment:
      POSTGRES_DB: arbitrio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: .
    environment:
      - JWT_KEY=CZ3QrSkZWfO1szcXftV77KrlQGBKxjI5aOCKuv9hV1o
      - JWT_EXPIRY=86400000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
volumes:
  pgdata: